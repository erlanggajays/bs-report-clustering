[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-analytics-engine"
version = "0.1.0"
description = "Ingest BrowserStack mobile test results, cluster failures with ML/NLP, and render a standalone HTML analytics report."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "plotly>=5.18",
    "jinja2>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
bsa-report = "cli:main"

# Flat module layout under src/ (config, ingestor, cli, …).
[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "config",
    "ingestor",
    "triage_engine",
    "exec_metrics",
    "report_generator",
    "history",
    "cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (F), pycodestyle errors (E), import sorting (I).
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is handled by the formatter, not enforced hard

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # sklearn / plotly / scipy ship partial or no stubs
warn_unused_ignores = true
